name: release-please

# Versioning is release-please's, derived from Conventional Commits on main. The VERSION_NAME line
# in gradle.properties and the manifest are rewritten by it and by nothing else.
#
# build-and-attach builds the versioned release APK (for sideloading) and release AAB (for Google
# Play) and attaches both to the release in this same run. A separate tag-triggered workflow would
# never fire: release-please pushes its tag with the default GITHUB_TOKEN, and GitHub does not
# start workflow runs from events that token initiated.
#
# The release APK and AAB are signed with the stable release keystore (docs/adr/0002). The four
# keystore secrets are required; the job fails before building if any is missing, and refuses to
# attach an APK or AAB that is unsigned, debug-signed, or (when ANDROID_KEYSTORE_SHA256 is set)
# signed by any certificate other than the pinned one.
#
# workflow_dispatch with `backfill_tag` rebuilds and re-attaches the APK and AAB for an existing
# release tag (for example one published before signing was wired up); release-please itself is
# skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill_tag:
        description: Existing release tag to rebuild, sign and (re)attach the APK and AAB for.
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pinned to a SHA, not a tag: a tag can move, and this runs with this repository's token.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  build-and-attach:
    name: build and attach the release APK and AAB
    needs: release-please
    # always() so a manual backfill still runs when release-please was skipped.
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.backfill_tag != ''))
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.backfill_tag }}
    steps:
      # Fail before anything is built if a required signing secret is missing. Names only, never
      # values. ANDROID_KEYSTORE_SHA256 is optional and checked by the signature gate below.
      - name: Check the release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_ALIAS ANDROID_KEY_ALIAS_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Release signing::Repository secret $name is missing or empty."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to build a release without the stable release keystore (docs/adr/0002)."
            exit 1
          fi

      # The exact commit release-please tagged, with its own version bump already applied.
      - name: Check out the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The signature gate runs from main, so backfilling an older tag still runs the current gate.
      - name: Check out main for the release-signature gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: verification-gate

      - name: Set up the JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      # build-tools also provides apksigner for the signature gate.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Gradle needs a keystore file, not the base64 secret. The decoded file lives only in the
      # runner temp directory, readable by this user alone, is never logged, and is removed below.
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/release.keystore"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      # app/build.gradle.kts signs release from these env vars plus ANDROID_KEYSTORE_PATH, with
      # v1/v2/v3 stated for the APK (an AAB is JAR-signed only), and never falls back to the debug
      # key. Both are built here, while the decoded keystore exists.
      - name: Build the signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # AGP names the bundle app-release.aab and ignores the APK's outputFileName hook, so it is
      # renamed to match the APK. VERSION_NAME is read from the checked-out tag's gradle.properties
      # (so a backfill gets that tag's version), without release-please's trailing marker comment.
      # Kept identical to the same step in pr.yml.
      - name: Name the release AAB
        run: |
          version_name="$(sed -n 's/^VERSION_NAME=\([^#]*\).*$/\1/p' gradle.properties | head -n 1 | tr -d '[:space:]')"
          bundle_dir=app/build/outputs/bundle/release
          if [ -z "$version_name" ]; then
            echo "::error title=Release AAB::VERSION_NAME is missing or empty in gradle.properties."
            exit 1
          fi
          if [ ! -f "$bundle_dir/app-release.aab" ]; then
            echo "::error title=Release AAB::$bundle_dir/app-release.aab was not built."
            exit 1
          fi
          mv "$bundle_dir/app-release.aab" "$bundle_dir/simple-stretch-$version_name-release.aab"

      # Refuses anything unsigned, debug-signed, multi-signed, or (when the optional pin secret is
      # set) signed by a certificate other than the pinned one, for the APK (apksigner) and the AAB
      # (jarsigner and keytool) alike. Runs before the upload, so an unsigned or debug-signed AAB is
      # never attached: a failure here ends the job.
      - name: Verify the release signatures of the APK and AAB
        env:
          ANDROID_KEYSTORE_SHA256: ${{ secrets.ANDROID_KEYSTORE_SHA256 }}
        run: >-
          python3 verification-gate/.github/scripts/verify_release_signature.py
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab

      # Uses the runner's pre-installed gh CLI rather than another pinned action. --clobber lets a
      # backfill replace an earlier (debug-signed) asset of the same name.
      - name: Attach the release APK and AAB to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --clobber \
            --repo "${{ github.repository }}"
