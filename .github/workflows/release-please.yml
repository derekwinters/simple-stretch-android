name: release-please

# Versioning is release-please's, derived from Conventional Commits on main. The VERSION_NAME line
# in gradle.properties and the manifest are rewritten by it and by nothing else.
#
# build-and-attach builds the versioned release APK and attaches it to the release in this same
# run. A separate tag-triggered workflow would never fire: release-please pushes its tag with the
# default GITHUB_TOKEN, and GitHub does not start workflow runs from events that token initiated.
#
# The release APK is debug-signed (docs/adr/0001-debug-signing-until-release-keystore.md), so no
# secrets are referenced anywhere in this workflow.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pinned to a SHA, not a tag: a tag can move, and this runs with this repository's token.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  build-and-attach:
    name: build and attach the release APK
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # The exact commit release-please tagged, with its own version bump already applied.
      - name: Check out the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up the JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Debug-signed via signingConfig = debug in app/build.gradle.kts (ADR 0001).
      - name: Assemble the release APK
        run: ./gradlew assembleRelease

      # Uses the runner's pre-installed gh CLI rather than another pinned action.
      - name: Attach the release APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            app/build/outputs/apk/release/*.apk \
            --repo "${{ github.repository }}"
