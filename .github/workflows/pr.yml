name: pr

# The build gate for a pull request: the unit tests must pass, the store screenshots must match
# the committed images, the store listing text must be in step with the spec, and the app must
# assemble. This is also where the Android build is
# verified at all: the Android SDK and the Android Gradle Plugin come from Google's servers, which
# not every development environment can reach.
#
# For a pull request from a branch of this repository (never a fork) it also builds the APK signed
# with the stable release keystore (docs/adr/0002), so the PR can be installed in place over a
# release of 0.3.0 or later (the application ID changed in 0.3.0, #42), and the release AAB signed
# with the same key. Fork PRs get no secrets from GitHub, and the steps are skipped for them
# outright.

# Every pull request, whatever its base branch, so stacked PRs are built too.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: test and assemble
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # SCHED-016: the app reads the current time and zone from one clock, AppClock, handed out
      # by StretchApp. Outside that file, code under app/src/main must not read the system clock
      # itself: no no-argument now() (LocalDate.now(), Instant.now(), ...), no
      # System.currentTimeMillis() and no Clock.system* (Clock.systemDefaultZone(),
      # Clock.systemUTC(), Clock.system(zone)). Pass the app clock instead, e.g.
      # LocalDate.now(clock).
      - name: Check that the current time is read only from the app clock
        run: |
          clock_file='app/src/main/java/com/derekwinters/stretch/AppClock.kt'
          pattern='(^|[^A-Za-z0-9_])now\([[:space:]]*\)|System\.currentTimeMillis\(|Clock\.system'
          hits="$(grep -rnE --include='*.kt' --include='*.java' "$pattern" app/src/main \
            | grep -v "^$clock_file:" || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error title=Current time (SCHED-016)::Code under app/src/main reads the" \
              "system clock directly (a no-argument now(), System.currentTimeMillis() or" \
              "Clock.system*) outside" \
              "$clock_file. Read the app clock instead (StretchApp.clock), e.g." \
              "LocalDate.now(clock) or clock.millis(); see docs/spec/scheduling.md SCHED-016."
            exit 1
          fi
          echo "OK: outside $clock_file, nothing under app/src/main reads the system clock directly."

      # STORE-LIST-006 (docs/spec/store-listing.md): the Google Play listing text is hand-written
      # in docs/store/listing.md, each claim citing the requirement IDs it rests on, and compiled
      # into fastlane/metadata/android/en-US/*.txt. Fails when a claim cites a missing or retired
      # ID, a `store: headline` spec page has no claim, a spec page has no store marker, a file is
      # over Google Play's limit, or the committed files differ from what the script compiles
      # (run `python3 .github/scripts/store_listing.py` and commit). Writes nothing.
      - name: Check the store listing text against the spec
        run: python3 .github/scripts/store_listing.py --check

      - name: Set up the JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # Also validates the checksum of the committed gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Standard library only; covers the release-signature gate used below and on release, the
      # release version-code guard (docs/adr/0003) and the store listing check (STORE-LIST-001
      # to STORE-LIST-006).
      - name: Run the release gate and store listing tests
        run: python3 -m unittest discover -s .github/scripts/tests -v

      # Every unit test, debug and release, as `./gradlew test` would, without running the debug
      # ones twice: verifyRoborazziDebug runs testDebugUnitTest itself, with the verify setting.
      #
      # STORE-SHOT (docs/spec/store-listing.md): that verify run renders the Google Play
      # screenshots and compares them with the images committed in
      # fastlane/metadata/android/en-US/images/phoneScreenshots/. A changed or missing image fails
      # the job. This workflow only verifies (STORE-SHOT-008); recording happens only when a
      # person asks for it: the `record-store-screenshots` label (record-store-screenshots.yml,
      # which pushes to a side branch, never to the PR branch) or `./gradlew recordRoborazziDebug`
      # locally. The new images then arrive in the PR by a person's push, which runs this workflow
      # to verify them.
      - name: Run the unit tests and verify the store screenshots
        run: ./gradlew testReleaseUnitTest verifyRoborazziDebug --stacktrace

      # On a failure (a test or the verify), the rendered (_actual) and diff (_compare) images, so a reviewer can
      # see what changed without a local build.
      - name: Upload the store screenshot diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-screenshot-diffs
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      # buildSrc is a build of its own, and ./gradlew test does not run its tests: the
      # version-code formula that derives versionCode from VERSION_NAME (docs/adr/0003).
      - name: Run the version-code formula tests
        run: ./gradlew -p buildSrc test --stacktrace

      # Room exports its schema to app/schemas/ during the build; upload it so a schema change
      # can be reviewed against the committed copy without a local Android build.
      - name: Upload the exported Room schemas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn
          retention-days: 3

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug

      # Issue #42 invariant: the application ID is exactly
      # `io.github.derekwinters.simple_stretch_android` (it matches the Play Console registration
      # and can never change after the first Play upload). Reads the built APK itself with aapt2,
      # found as in check_version_code.py: PATH, else the newest $ANDROID_HOME build-tools copy.
      - name: Check the application ID of the debug APK
        run: |
          expected='io.github.derekwinters.simple_stretch_android'
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::expected exactly one debug APK, found ${#apks[@]}"
            exit 1
          fi
          aapt2="$(command -v aapt2 || true)"
          if [ -z "$aapt2" ] && [ -n "${ANDROID_HOME:-}" ]; then
            candidates=("$ANDROID_HOME"/build-tools/*/aapt2)
            if [ "${#candidates[@]}" -gt 0 ]; then
              aapt2="$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n 1)"
            fi
          fi
          if [ -z "$aapt2" ]; then
            echo "::error::aapt2 not found on PATH or under \$ANDROID_HOME/build-tools"
            exit 1
          fi
          # Captured first, never piped: a reader that stops early (head) would SIGPIPE aapt2 and
          # pipefail would fail the step.
          if ! badging="$("$aapt2" dump badging "${apks[0]}")"; then
            echo "::error::aapt2 dump badging failed for ${apks[0]}"
            exit 1
          fi
          package_line="$(grep -m 1 '^package:' <<<"$badging" || true)"
          echo "$package_line"
          # aapt2 prints name first on the package line; the whole quoted value is compared, not a
          # prefix.
          re="^package: name='([^']*)'( |$)"
          if [[ ! "$package_line" =~ $re ]]; then
            echo "::error::no package name in the aapt2 output for ${apks[0]}"
            exit 1
          fi
          actual="${BASH_REMATCH[1]}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the debug APK's application ID is '$actual'," \
              "expected exactly '$expected' (issue #42)"
            exit 1
          fi
          echo "OK: the application ID is $expected."

      # A debug build: separate debug key, so it cannot be installed over a release-signed build
      # (uninstall first). The release-signed artifact below is the one that installs in place
      # over a release of 0.3.0 or later (the application ID changed in 0.3.0, #42).
      - name: Upload the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simple-stretch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Same-repository PRs only. Detects (without printing) whether all four required signing
      # secrets are present; if not, the release-signed build is skipped with a warning rather
      # than failing the PR.
      - name: Check for the release signing secrets
        id: signing
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          available=true
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_ALIAS ANDROID_KEY_ALIAS_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning title=Release signing::Secret $name is not available; skipping the release-signed APK and AAB."
              available=false
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Decode the release keystore
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/release.keystore"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build the release-signed APK and AAB
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # AGP names the bundle app-release.aab and ignores the APK's outputFileName hook, so it is
      # renamed to match the APK, using VERSION_NAME from gradle.properties without
      # release-please's trailing marker comment. Kept identical to the same step in
      # release-please.yml, which reads the exported version back from the release.
      - name: Name the release AAB
        if: steps.signing.outputs.available == 'true'
        run: |
          version_name="$(sed -n 's/^VERSION_NAME=\([^#]*\).*$/\1/p' gradle.properties | head -n 1 | tr -d '[:space:]')"
          bundle_dir=app/build/outputs/bundle/release
          if [ -z "$version_name" ]; then
            echo "::error title=Release AAB::VERSION_NAME is missing or empty in gradle.properties."
            exit 1
          fi
          if [ ! -f "$bundle_dir/app-release.aab" ]; then
            echo "::error title=Release AAB::$bundle_dir/app-release.aab was not built."
            exit 1
          fi
          mv "$bundle_dir/app-release.aab" "$bundle_dir/simple-stretch-$version_name-release.aab"
          echo "RELEASE_VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      # Covers the APK and the AAB. Runs before either upload, so an unsigned or debug-signed AAB
      # is never uploaded: a failure here ends the job.
      - name: Verify the release signatures of the APK and AAB
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_SHA256: ${{ secrets.ANDROID_KEYSTORE_SHA256 }}
        run: >-
          python3 .github/scripts/verify_release_signature.py
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab

      # Signed by the same key as GitHub Releases, so it installs in place over a release of
      # 0.3.0 or later (the application ID changed in 0.3.0, #42).
      - name: Upload the release-signed APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simple-stretch-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # The Google Play upload format, signed by the same key. Not installable directly; the APK
      # above is the one to sideload.
      - name: Upload the release-signed AAB
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simple-stretch-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
